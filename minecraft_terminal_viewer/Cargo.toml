[package]
name = "minecraft_terminal_viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = "0.29.0"
image = "0.24.8"
russh = "0.52.1"
tokio = { version = "1.45.0", features = ["full"] }
ratatui = "0.29.0"
rand_core = "0.6.4"
anyhow = "1.0.98"
atty = "0.2.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
